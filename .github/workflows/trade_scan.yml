name: HYDRA Trade Scan

on:
  schedule:
    - cron: "15 10 * * 1-5"
    - cron: "15 18 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "Количество тикеров для скана"
        required: false
        default: "10"
      explain:
        description: "Добавлять LLM-объяснение"
        required: false
        default: "true"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run HYDRA trade scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          API_KEY: ${{ secrets.API_KEY }}
          MODEL: ${{ secrets.MODEL }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '10' }}"
          EXPLAIN=""
          if [ "${{ github.event.inputs.explain || 'true' }}" = "true" ]; then
            EXPLAIN="--explain"
          fi
          python hydra.py trade scan "$LIMIT" $EXPLAIN
